version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: routeshield-app
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - FRONTEND_URL=http://localhost:5000
      - MONGODB_URI=mongodb://mongo:27017/routeshield
      - JWT_SECRET=routeshield_production_jwt_secret_please_change_in_production_key_0987654321
      - COOKIE_SECRET=routeshield_production_cookie_secret_super_secure_key_1234567890
      - NOMINATIM_BASE_URL=https://nominatim.openstreetmap.org
      - NOMINATIM_USER_AGENT=RouteShield-SaferRoutePlanner/1.0 (deploy@routeshield.org)
      - OSRM_BASE_URL=https://router.project-osrm.org
      - OVERPASS_API_URL=https://overpass-api.de/api/interpreter
      - RATE_LIMIT_WINDOW_MS=900000
      - RATE_LIMIT_MAX_REQUESTS=100
      - AUTH_RATE_LIMIT_MAX_REQUESTS=15
      - UPLOAD_MAX_SIZE_MB=5
      - UPLOAD_DIRECTORY=uploads
    volumes:
      - routeshield_uploads:/app/uploads
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - routeshield-net

  mongo:
    image: mongo:7.0
    container_name: routeshield-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - routeshield_db_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - routeshield-net

volumes:
  routeshield_db_data:
  routeshield_uploads:

networks:
  routeshield-net:
    driver: bridge
